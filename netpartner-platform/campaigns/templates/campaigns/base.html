{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetPartner{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="{% static 'campaigns/netpartner.css' %}">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a href="{% url 'home' %}" class="logo">
      <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#6A45F5"/><path d="M29 12 19 36" fill="none" stroke="#D4FF3A" stroke-width="6" stroke-linecap="round"/></svg>
      net/partner
    </a>
    {% with page=request.resolver_match.url_name %}
    <div class="nav">
      <a href="{% url 'home' %}" class="{% if page == 'home' or page == 'campaign_detail' or page == 'campaign_tracker' %}active{% endif %}">Overview</a>      <a href="/new/" class="{% if page == 'new_campaign' %}active{% endif %}">New campaign</a>
      <a href="/admin/">Admin</a>
    </div>
    {% endwith %}
  </nav>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
