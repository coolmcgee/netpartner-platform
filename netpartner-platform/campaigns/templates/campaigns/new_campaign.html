{% extends "campaigns/base.html" %}

{% block content %}
<a href="{% url 'home' %}">← Back to overview</a>
<div>
  <h1>New campaign</h1>
  <p class="muted">Set it up in a few minutes. We check every campaign before it goes live.</p>
</div>

<form method="post" class="panel form-panel">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Submit campaign</button>
</form>
{% endblock %}
